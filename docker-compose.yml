services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    # Secrets are injected at runtime, never baked into the image
    # (backend/.dockerignore excludes .env from the build context).
    # Copy backend/.env.example to backend/.env before the first run.
    env_file:
      # Optional so a fresh clone still starts. Without it the app falls back to
      # config.yaml's defaults and logs a warning about the forgeable secret.
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kitchen
      DB_PASSWORD: kitchen
      DB_NAME: kitchen
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
