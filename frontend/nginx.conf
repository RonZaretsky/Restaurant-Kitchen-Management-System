server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable, and a request for one that is missing
    # must 404 rather than fall through to the history fallback below, which
    # would answer a .js request with HTML and a 200.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell itself is never cached, or a redeploy serves a stale index.html
    # that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every client-side route resolves to the shell; React Router takes it from
    # there. Without this a refresh or a direct hit on /login 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
